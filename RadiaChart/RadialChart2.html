<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Sector Counter</title>
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #00bcd4;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .chart-title {
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 24px;
        }

        #radial-chart-container {
            width: 400px;
            height: 400px;
            margin: 20px auto;
            position: relative;
        }

        .controls-panel {
            background-color: var(--bg-card);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 340px;
        }

        .slider-container {
            margin: 15px 0;
        }

        .slider-input {
            width: 100%;
            cursor: pointer;
        }

        .value-indicator {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="chart-title">Радіальний секторний лічильник</div>
    
    <div id="radial-chart-container"></div>

    <div class="controls-panel">
        <div>Значення: <span id="value-display" class="value-indicator">0</span></div>
        
        <div class="slider-container">
            <input type="range" id="chart-value-slider" min="-60" max="60" value="25" step="1" class="slider-input">
        </div>
    </div>

    <script>
        const RadialChart = {
            SETTINGS: {
                TOTAL_SEGMENTS: 60,
                STEP_INTERVAL: 5,
                LINE_WIDTH_BORDER: 3,
                LINE_WIDTH_AXIS: 2,
                COLOR_BACKGROUND: '#4a4a4a',
                COLOR_FOREGROUND: '#000000',
                COLOR_TEXT: '#ffffff'
            },

            convertToRadians(value) {
                const degreesPerUnit = 360 / this.SETTINGS.TOTAL_SEGMENTS;
                return (value * degreesPerUnit * Math.PI) / 180 - Math.PI / 2;
            },

            render(containerId, value = 0, activeSectorColor = '#ff9800') {
                const container = document.getElementById(containerId);
                if (!container) return;

                container.innerHTML = '';

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const size = Math.min(container.clientWidth, container.clientHeight);
                canvas.width = size;
                canvas.height = size;
                container.appendChild(canvas);

                const centerX = size / 2;
                const centerY = size / 2;
                
                // Два радіуси для створення меж
                const maxRadius = size * 0.45;          // Зовнішній край диска (після цифр)
                const innerCircleRadius = size * 0.35;  // Внутрішній край диска (до цифр)

                // 1. Малювання СУЦІЛЬНОГО СІРОГО ФОНУ аж до самої зовнішньої границі
                ctx.beginPath();
                ctx.arc(centerX, centerY, maxRadius, 0, 2 * Math.PI);
                ctx.fillStyle = this.SETTINGS.COLOR_BACKGROUND;
                ctx.fill();

                // 2. Малювання активного кольорового сектора (обмежений внутрішнім радіусом)
                if (value !== 0) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);

                    const startAngle = this.convertToRadians(0);
                    const endAngle = this.convertToRadians(value);
                    const isCounterClockwise = value < 0;

                    ctx.arc(centerX, centerY, innerCircleRadius, startAngle, endAngle, isCounterClockwise);
                    ctx.closePath();
                    ctx.fillStyle = activeSectorColor;
                    ctx.fill();
                }

                // 3. Побудова чорних ліній та рендеринг білих цифр
                ctx.font = `bold ${size * 0.045}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (let i = 0; i < this.SETTINGS.TOTAL_SEGMENTS; i += this.SETTINGS.STEP_INTERVAL) {
                    const angle = this.convertToRadians(i);

                    // Лінії розрізів йдуть від центру лише до внутрішньої границі (до цифр)
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(
                        centerX + innerCircleRadius * Math.cos(angle), 
                        centerY + innerCircleRadius * Math.sin(angle)
                    );
                    ctx.strokeStyle = this.SETTINGS.COLOR_FOREGROUND;
                    ctx.lineWidth = this.SETTINGS.LINE_WIDTH_AXIS;
                    ctx.stroke();

                    // Цифри рендеряться у кільці між внутрішнім та зовнішнім колами
                    const textRadius = (maxRadius + innerCircleRadius) / 2;
                    const textX = centerX + textRadius * Math.cos(angle);
                    const textY = centerY + textRadius * Math.sin(angle);
                    
                    ctx.fillStyle = this.SETTINGS.COLOR_TEXT;
                    ctx.fillText(i.toString(), textX, textY);
                }

                // 4. ГРАНИЦЯ 1: Внутрішнє чорне коло (до цифр)
                ctx.beginPath();
                ctx.arc(centerX, centerY, innerCircleRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = this.SETTINGS.COLOR_FOREGROUND;
                ctx.lineWidth = this.SETTINGS.LINE_WIDTH_BORDER;
                ctx.stroke();

                // 5. ГРАНИЦЯ 2: Зовнішнє чорне коло (після цифр, де закінчується сірий фон)
                ctx.beginPath();
                ctx.arc(centerX, centerY, maxRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = this.SETTINGS.COLOR_FOREGROUND;
                ctx.lineWidth = this.SETTINGS.LINE_WIDTH_BORDER;
                ctx.stroke();
                
                // 6. Центральна чорна точка
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = this.SETTINGS.COLOR_FOREGROUND;
                ctx.fill();
            }
        };

        // --- Обробка інтерфейсу ---

        const valueSlider = document.getElementById('chart-value-slider');
        const valueDisplay = document.getElementById('value-display');

        function updateChartHandler() {
            const currentValue = parseInt(valueSlider.value, 10);
            valueDisplay.innerText = currentValue >= 0 ? `+${currentValue}` : currentValue;
            
            let sectorColor = '#4CAF50'; 
            if (currentValue < 0) sectorColor = '#F44336';
            if (currentValue === 0) sectorColor = '#4a4a4a';
            
            RadialChart.render('radial-chart-container', currentValue, sectorColor);
        }

        valueSlider.addEventListener('input', updateChartHandler);
        updateChartHandler();
    </script>
</body>
</html>

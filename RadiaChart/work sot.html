<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Гексагональна Матриця на Весь Екран</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f1f5f9;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #1e293b;
        margin-bottom: 5px;
      }
      p {
        color: #64748b;
        margin-bottom: 25px;
      }

      /* Батьківський DIV-контейнер, який тепер повністю заповнюється сіткою */
      .grid-wrapper {
        width: 100%;
        max-width: 650px;
        aspect-ratio: 1 / 1; /* Чистий квадрат */
        background-color: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        border: 2px solid #e2e8f0;
        padding: 10px; /* Мінімальний відступ для осей, щоб соти займали максимум місця */
        box-sizing: border-box;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .hex {
        transition:
          fill 0.2s,
          stroke-width 0.2s;
        cursor: pointer;
      }
      .hex:hover {
        stroke-width: 2.5px;
        filter: brightness(0.95);
      }
      .hex-icon {
        font-size: 28px;
        font-weight: bold;
        pointer-events: none;
        user-select: none;
      }
      .axis-line {
        stroke: #cbd5e1;
        stroke-width: 1.2;
        stroke-dasharray: 4 4;
      }
      .axis-text {
        font-size: 16px;
        fill: #0f172a;
        font-family: "Courier New", Courier, monospace;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <h1>Максимальне заповнення обгортки</h1>
    <p>
      Калібрування viewBox дозволило сотам розширитися на всю площу квадратного
      div-блоку.
    </p>

    <div class="grid-wrapper">
      <!-- Компактніший viewBox (950x950), що змушує графіку розтягнутися на весь доступний простір -->
      <svg id="hex-grid" viewBox="0 0 950 950"></svg>
    </div>

    <script>
      const svg = document.getElementById("hex-grid");

      // Віртуальна геометрія (трохи збільшено радіус для щільного заповнення візуального куба)
      const size = 30;
      const hexWidth = Math.sqrt(3) * size;
      const hexHeight = 2 * size;

      const startX = 16,
        endX = 42;
      const startY = 1,
        endY = 15;

      // Зменшені внутрішні відступи, щоб притиснути осі до країв SVG-полотна
      const offsetX = 110;
      const offsetY = 100;

      // Центр карти [29;8]
      const customCells = {
        "29-8": { color: "#fed7aa", icon: "👑", stroke: "#ea580c" },
      };

      const rawCoordinates = [];

      // Базові координати з вашого ТЗ
      for (let x = 24; x <= 34; x += 2) {
        rawCoordinates.push({ x, y: 1 }, { x, y: 15 });
      }
      for (let x = 21; x <= 37; x += 2) {
        rawCoordinates.push({ x, y: 2 }, { x, y: 14 });
      }
      for (let x = 20; x <= 38; x += 2) {
        rawCoordinates.push({ x, y: 3 }, { x, y: 13 });
      }
      for (let x = 19; x <= 39; x += 2) {
        rawCoordinates.push({ x, y: 4 }, { x, y: 12 });
      }
      for (let x = 18; x <= 40; x += 2) {
        rawCoordinates.push({ x, y: 5 }, { x, y: 11 });
      }
      for (let x = 17; x <= 41; x += 2) {
        rawCoordinates.push({ x, y: 6 }, { x, y: 10 });
      }
      for (let x = 16; x <= 42; x += 2) {
        rawCoordinates.push({ x, y: 7 }, { x, y: 9 });
      }
      for (let x = 17; x <= 41; x += 2) {
        rawCoordinates.push({ x, y: 8 });
      }

      const activeCellsSet = new Set(
        rawCoordinates.map((c) => `${c.x}-${c.y}`),
      );

      function getHexPoints(cx, cy, r) {
        let points = [];
        for (let i = 0; i < 6; i++) {
          let angle_deg = 60 * i - 30;
          let angle_rad = (Math.PI / 180) * angle_deg;
          points.push(
            `${cx + r * Math.cos(angle_rad)},${cy + r * Math.sin(angle_rad)}`,
          );
        }
        return points.join(" ");
      }

      // Прорахунок центрів без зазорів
      const centers = {};
      for (let y = startY; y <= endY; y++) {
        let rIndex = y - startY;
        for (let x = startX; x <= endX; x++) {
          let cx = (x - startX) * (hexWidth / 2) + offsetX;
          let cy = rIndex * hexHeight * 0.75 + offsetY;

          if (!centers[x]) centers[x] = {};
          centers[x][y] = { x: cx, y: cy };
        }
      }

      // Коректне визначення меж для ліній осей
      const minX_Px = centers[startX][startY].x;
      const maxX_Px = centers[endX][startY].x;
      const minY_Px = centers[startX][startY].y;
      const maxY_Px = centers[startX][endY].y;

      // Лінії осей тепер простягаються точно від краю до краю viewBox (0 до 950)
      const lineTopY = minY_Px - 45;
      const lineBottomY = maxY_Px + 45;
      const lineLeftX = minX_Px - 55;
      const lineRightX = maxX_Px + 55;

      // 1. Вертикальні осі X (ПАРНІ підписи)
      for (let x = startX; x <= endX; x++) {
        let fixedCx = centers[x][startY].x;

        let line = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line",
        );
        line.setAttribute("x1", fixedCx);
        line.setAttribute("y1", lineTopY);
        line.setAttribute("x2", fixedCx);
        line.setAttribute("y2", lineBottomY);
        line.setAttribute("class", "axis-line");
        svg.appendChild(line);

        if (x % 2 === 0) {
          let text = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          text.setAttribute("x", fixedCx);
          text.setAttribute("y", lineTopY - 15);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("class", "axis-text");
          text.textContent = x;
          svg.appendChild(text);
        }
      }

      // 2. Горизонтальні осі Y (Всі 1–15)
      for (let y = startY; y <= endY; y++) {
        let fixedCy = centers[startX][y].y;

        let line = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line",
        );
        line.setAttribute("x1", lineLeftX);
        line.setAttribute("y1", fixedCy);
        line.setAttribute("x2", lineRightX);
        line.setAttribute("y2", fixedCy);
        line.setAttribute("class", "axis-line");
        svg.appendChild(line);

        let text = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text",
        );
        text.setAttribute("x", lineLeftX - 30);
        text.setAttribute("y", fixedCy + 5);
        text.setAttribute("text-anchor", "start");
        text.setAttribute("class", "axis-text");
        text.textContent = `Y:${y}`;
        svg.appendChild(text);
      }

      // 3. Відмальовування сот
      for (let y = startY; y <= endY; y++) {
        for (let x = startX; x <= endX; x++) {
          const key = `${x}-${y}`;

          if (!activeCellsSet.has(key)) continue;

          const { x: cx, y: cy } = centers[x][y];
          const hasCustom = customCells[key];

          let fillColor =
            hasCustom && customCells[key].color
              ? customCells[key].color
              : "#f8fafc";
          let strokeColor =
            hasCustom && customCells[key].stroke
              ? customCells[key].stroke
              : "#cbd5e1";
          let strokeWidth =
            hasCustom && customCells[key].stroke ? "3.5" : "1.5";
          let iconSymbol =
            hasCustom && customCells[key].icon ? customCells[key].icon : "";

          const polygon = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon",
          );
          polygon.setAttribute("points", getHexPoints(cx, cy, size));
          polygon.setAttribute("fill", fillColor);
          polygon.setAttribute("stroke", strokeColor);
          polygon.setAttribute("stroke-width", strokeWidth);
          polygon.setAttribute("class", "hex");

          polygon.addEventListener("click", () => {
            alert(`Координати соти: X = ${x}, Y = ${y}`);
          });
          svg.appendChild(polygon);

          if (iconSymbol !== "") {
            const iconText = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text",
            );
            iconText.setAttribute("x", cx);
            iconText.setAttribute("y", cy);
            iconText.setAttribute("text-anchor", "middle");
            iconText.setAttribute("dominant-baseline", "central");
            iconText.setAttribute("class", "hex-icon");
            iconText.setAttribute("fill", "#0f172a");
            iconText.textContent = iconSymbol;
            svg.appendChild(iconText);
          }
        }
      }
    </script>
  </body>
</html>

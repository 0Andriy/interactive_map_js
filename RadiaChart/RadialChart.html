<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Sector Counter</title>
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #00bcd4;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .chart-title {
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 24px;
        }

        /* Контейнер для Canvas */
        #radial-chart-container {
            width: 400px;
            height: 400px;
            margin: 20px auto;
            position: relative;
        }

        /* Панель керування */
        .controls-panel {
            background-color: var(--bg-card);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 340px;
        }

        .slider-container {
            margin: 15px 0;
        }

        .slider-input {
            width: 100%;
            cursor: pointer;
        }

        .value-indicator {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .panel-hint {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="chart-title">Радіальний секторний лічильник</div>
    
    <!-- Цільовий контейнер для рендерингу -->
    <div id="radial-chart-container"></div>

    <!-- Інтерфейс користувача -->
    <div class="controls-panel">
        <div>Значення: <span id="value-display" class="value-indicator">0</span></div>
        
        <div class="slider-container">
            <input type="range" id="chart-value-slider" min="-60" max="60" value="25" step="1" class="slider-input">
        </div>
        
        <div class="panel-hint">Перетягуйте повзунок для зміни сектора</div>
    </div>

    <script>
        /**
         * Модуль для рендерингу кругового секторного лічильника
         */
        const RadialChart = {
            // Константи конфігурації
            SETTINGS: {
                TOTAL_SEGMENTS: 60,
                STEP_INTERVAL: 5,
                LINE_WIDTH_BORDER: 3,
                LINE_WIDTH_AXIS: 2,
                COLOR_BACKGROUND: '#4a4a4a',
                COLOR_FOREGROUND: '#000000',
                COLOR_TEXT: '#ffffff'
            },

            /**
             * Переводить внутрішні одиниці шкали в радіани із нульовою точкою на 12:00
             * @param {number} value - Поточне значення лічильника
             * @returns {number} Кут в радіанах
             */
            convertToRadians(value) {
                const degreesPerUnit = 360 / this.SETTINGS.TOTAL_SEGMENTS;
                return (value * degreesPerUnit * Math.PI) / 180 - Math.PI / 2;
            },

            /**
             * Головний метод відмальовки діаграми
             * @param {string} containerId - ID DOM-контейнера
             * @param {number} value - Поточне значення лічильника (від -60 до 60)
             * @param {string} activeSectorColor - HEX/RGB колір активного сектора
             */
            render(containerId, value = 0, activeSectorColor = '#ff9800') {
                const container = document.getElementById(containerId);
                if (!container) return;

                container.innerHTML = '';

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Адаптація під розміри батьківського блоку
                const size = Math.min(container.clientWidth, container.clientHeight);
                canvas.width = size;
                canvas.height = size;
                container.appendChild(canvas);

                const centerX = size / 2;
                const centerY = size / 2;
                
                // Розрахунок радіусів компонентів
                const maxRadius = size * 0.45; 
                const innerCircleRadius = size * 0.35; 

                // 1. Задній фон базового кола
                ctx.beginPath();
                ctx.arc(centerX, centerY, innerCircleRadius, 0, 2 * Math.PI);
                ctx.fillStyle = this.SETTINGS.COLOR_BACKGROUND;
                ctx.fill();

                // 2. Рендеринг активного кольорового сектора
                if (value !== 0) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);

                    const startAngle = this.convertToRadians(0);
                    const endAngle = this.convertToRadians(value);
                    const isCounterClockwise = value < 0;

                    ctx.arc(centerX, centerY, innerCircleRadius, startAngle, endAngle, isCounterClockwise);
                    ctx.closePath();
                    ctx.fillStyle = activeSectorColor;
                    ctx.fill();
                }

                // 3. Побудова радіальних осей (розподільчих ліній) та цифрових міток
                ctx.font = `bold ${size * 0.045}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (let i = 0; i < this.SETTINGS.TOTAL_SEGMENTS; i += this.SETTINGS.STEP_INTERVAL) {
                    const angle = this.convertToRadians(i);

                    // Малювання роздільчих ліній всередині кола
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(
                        centerX + innerCircleRadius * Math.cos(angle), 
                        centerY + innerCircleRadius * Math.sin(angle)
                    );
                    ctx.strokeStyle = this.SETTINGS.COLOR_FOREGROUND;
                    ctx.lineWidth = this.SETTINGS.LINE_WIDTH_AXIS;
                    ctx.stroke();

                    // Рендеринг текстових міток (чисел) навколо кола
                    const textRadius = (maxRadius + innerCircleRadius) / 2;
                    const textX = centerX + textRadius * Math.cos(angle);
                    const textY = centerY + textRadius * Math.sin(angle);
                    
                    ctx.fillStyle = this.SETTINGS.COLOR_TEXT;
                    ctx.fillText(i.toString(), textX, textY);
                }

                // 4. Зовнішній чорний контур внутрішнього кола
                ctx.beginPath();
                ctx.arc(centerX, centerY, innerCircleRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = this.SETTINGS.COLOR_FOREGROUND;
                ctx.lineWidth = this.SETTINGS.LINE_WIDTH_BORDER;
                ctx.stroke();
                
                // 5. Центральна точка перетину осей
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = this.SETTINGS.COLOR_FOREGROUND;
                ctx.fill();
            }
        };

        // --- Ініціалізація модуля та прив'язка подій інтерфейсу ---

        const valueSlider = document.getElementById('chart-value-slider');
        const valueDisplay = document.getElementById('value-display');

        function updateChartHandler() {
            const currentValue = parseInt(valueSlider.value, 10);
            
            // Форматування відображення тексту (додавання знаку + для додатних чисел)
            valueDisplay.innerText = currentValue >= 0 ? `+${currentValue}` : currentValue;
            
            // Динамічний вибір кольору: зелений для (> 0), червоний для (< 0), сірий для (0)
            let sectorColor = '#4CAF50'; 
            if (currentValue < 0) sectorColor = '#F44336';
            if (currentValue === 0) sectorColor = '#4a4a4a';
            
            // Виклик методу рендерингу
            RadialChart.render('radial-chart-container', currentValue, sectorColor);
        }

        // Реєстрація обробника події руху повзунка
        valueSlider.addEventListener('input', updateChartHandler);

        // Первинний запуск компонента при завантаженні сторінки
        updateChartHandler();
    </script>
</body>
</html>
